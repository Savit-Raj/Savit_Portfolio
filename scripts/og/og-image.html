<!doctype html>
<!--
  Social preview card (1200×630). Rendered to public/og-image.png by scripts/og/render.mjs.

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face { font-family: 'Geist'; src: url('../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
      @font-face { font-family: 'Geist Mono'; src: url('../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
      @font-face { font-family: 'Instrument Serif'; font-style: italic; src: url('../../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2') format('woff2'); }
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; background: #060708; color: #f6f5f0; font-family: 'Geist'; overflow: hidden; }
      .card { position: relative; width: 100%; height: 100%; padding: 64px 72px; display: flex; flex-direction: column; }
      .grid { position: absolute; inset: 0; background-image: linear-gradient(to right, rgb(255 255 255 / 0.05) 1px, transparent 1px), linear-gradient(to bottom, rgb(255 255 255 / 0.05) 1px, transparent 1px); background-size: 60px 60px; mask-image: radial-gradient(ellipse 80% 80% at 75% 35%, black, transparent); }
      .glow { position: absolute; width: 700px; height: 700px; border-radius: 50%; filter: blur(120px); }
      .top { display: flex; align-items: center; justify-content: space-between; position: relative; }
      .brand { display: flex; align-items: center; gap: 18px; }
      .logo { width: 60px; height: 60px; border-radius: 16px; border: 1px solid rgb(255 255 255 / 0.12); background: #0a0b0d; display: grid; place-items: center; }
      .name { font-size: 26px; font-weight: 500; letter-spacing: -0.02em; }
      .role { margin-top: 4px; font-family: 'Geist Mono'; font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase; color: #85847e; }
      .pill { display: flex; align-items: center; gap: 12px; border: 1px solid rgb(255 255 255 / 0.12); border-radius: 999px; padding: 12px 22px; font-size: 18px; color: #d9d8d1; background: rgb(10 11 13 / 0.7); }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #c8ff3d; box-shadow: 0 0 0 6px rgb(200 255 61 / 0.18); }
      h1 { position: relative; margin-top: auto; font-size: 96px; line-height: 0.95; font-weight: 500; letter-spacing: -0.045em; }
      em { font-family: 'Instrument Serif'; font-weight: 400; color: #c8ff3d; letter-spacing: -0.01em; }
      .foot { position: relative; margin-top: 44px; display: flex; justify-content: space-between; font-family: 'Geist Mono'; font-size: 17px; color: #85847e; letter-spacing: 0.04em; }
      .foot b { color: #f6f5f0; font-weight: 500; }
      svg.graph { position: absolute; right: 30px; top: 70px; opacity: 0.9; }
    </style>
  </head>
